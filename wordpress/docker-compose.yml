# Local WooCommerce backend for the storefront.
#   docker compose up -d          start MariaDB and WordPress on http://localhost:8080
#   docker compose run --rm setup install plugins and import the demo catalog

name: sweet-delights

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html

  setup:
    image: wordpress:cli-2.12-php8.3
    profiles: ["setup"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-change-me-locally}
      STOREFRONT_URL: ${STOREFRONT_URL:-http://host.docker.internal:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    volumes:
      - wp_data:/var/www/html
      - ./seed:/seed:ro
      - ../src/lib/catalog/demo-catalog.json:/seed-data/demo-catalog.json:ro
      - ../public/images/products:/seed-data/images:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["bash", "/seed/setup.sh"]

volumes:
  db_data:
  wp_data:
